# Builds the libretro core for each platform openSU runs on and publishes the zips and their
# SHA-256 as the tag's release.
name: Release
on:
  push:
    tags: ["20*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create from this ref
        required: true
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  NDK_VERSION: 28.2.13676358
  CMAKE_COMMON: -DCMAKE_BUILD_TYPE=Release -DLIBMGBA_ONLY=ON -DBUILD_LIBRETRO=ON
jobs:
  build:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux-x86_64
            os: ubuntu-24.04
            library: mgba_libretro.so
          - build: windows-x86_64
            os: ubuntu-24.04
            library: mgba_libretro.dll
          - build: macos-arm64
            os: macos-15
            library: mgba_libretro.dylib
          - build: android-arm64-v8a
            os: ubuntu-24.04
            abi: arm64-v8a
            library: mgba_libretro_android.so
          - build: android-x86_64
            os: ubuntu-24.04
            abi: x86_64
            library: mgba_libretro_android.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: startsWith(matrix.build, 'android-')
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ndk;${{ env.NDK_VERSION }}
      - name: Toolchain
        id: toolchain
        shell: bash
        run: |
          case "${{ matrix.build }}" in
            linux-*)
              sudo apt-get update -q && sudo apt-get install -y -q ninja-build
              echo "args=" >> "$GITHUB_OUTPUT" ;;
            windows-*)
              sudo apt-get update -q && sudo apt-get install -y -q ninja-build gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
              # Static libgcc and winpthread so the DLL needs nothing beside it.
              echo "args=-DCMAKE_SYSTEM_NAME=Windows -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres -DCMAKE_SHARED_LINKER_FLAGS=-static" >> "$GITHUB_OUTPUT" ;;
            macos-*)
              brew install ninja
              echo "args=-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_OUTPUT" ;;
            android-*)
              sudo apt-get update -q && sudo apt-get install -y -q ninja-build
              ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
              echo "args=-DCMAKE_TOOLCHAIN_FILE=$ndk/build/cmake/android.toolchain.cmake -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-28" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -G Ninja $CMAKE_COMMON ${{ steps.toolchain.outputs.args }}
          cmake --build build --target mgba_libretro
      - name: Package
        shell: bash
        run: |
          built=$(find build -maxdepth 1 -name 'mgba_libretro.*' -type f \( -name '*.so' -o -name '*.dll' -o -name '*.dylib' \))
          set -- $built
          test "$#" = 1
          mkdir -p stage out
          cp "$built" "stage/${{ matrix.library }}"
          (cd stage && zip -X -9 "../out/mgba_libretro_${{ matrix.build }}.zip" "${{ matrix.library }}")
          file "stage/${{ matrix.library }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.build }}
          path: out/*.zip
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum -- *.zip > SHA256SUMS && cat SHA256SUMS)
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "mGBA libretro core for openSU (Linux x86_64, Windows x64, macOS arm64, Android arm64-v8a and x86_64), built from $GITHUB_SHA."
